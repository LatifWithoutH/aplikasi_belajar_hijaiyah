name: writing_test
description: Writing Level 3 Test for Android - No STT
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # ✅ Dependencies Utama
  audioplayers: ^6.0.0      # Untuk audio (Android & Web*)
  google_fonts: ^6.1.0      # Untuk font Latin (Poppins)
  speech_to_text: ^6.6.0    # Untuk STT (Android & Web*)
  web: ^0.5.1               # ✅ PENTING: Dependency tambahan untuk web support

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  
  # ✅ Assets Audio
  assets:
    - assets/audio/
  
  # ✅ Font Lokal
  fonts:
    # ✅ Font Display - TintaArabic (untuk tampilan utama)
    - family: TintaArabic
      fonts:
        - asset: assets/fonts/TintaArabic-Bold.otf
          weight: 700
    
    # ✅ Font Writing - NotoNaskhArabic (khusus tracing/menulis)
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700